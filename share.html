<title>Recovery Record</title>
<style>
/* ============================================================
   TOKENS — dark-first (this app gets used at 3am, in the dark).
   :root carries the COMPLETE dark palette. Light is redefined
   for prefers-color-scheme:light (unless the viewer explicitly
   stamped dark) and again for [data-theme="light"].
   ============================================================ */
:root{
  --ground:#0A1519; --surface:#122228; --surface-2:#182F36; --surface-3:#1F3A42;
  --line:#22424B; --line-soft:#1A333A;
  --ink:#E7F1F2; --ink-2:#A2BABE; --ink-3:#6D8C93;
  --accent:#7FD1D8; --accent-ink:#0A1519; --accent-soft:#1B3D44;
  --sand:#F0B67F; --sand-soft:#3A2E22;
  --good:#6FCF8E; --warn:#EFC05A; --crit:#EF6F61;
  --good-bg:#153027; --warn-bg:#332B14; --crit-bg:#3A1F1C;
  --grid:#1C3840;
  /* sticker dots — validated for this surface (band + contrast pass).
     Identity is carried by FIXED SLOT POSITION as well as hue. */
  --d-green:#2F9E68; --d-blue:#3E8FD8; --d-yellow:#B4890F;
  --d-red:#DC4B45;   --d-purple:#8B5CD6; --d-orange:#CB6320;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r-sm:6px; --r:10px; --r-lg:16px; --pad:16px; --tabbar:66px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ground:#EBF0EF; --surface:#FFFFFF; --surface-2:#F2F6F6; --surface-3:#E6EEEE;
    --line:#CBDBDB; --line-soft:#DEE8E8;
    --ink:#08181D; --ink-2:#456067; --ink-3:#6C868C;
    --accent:#0C6E78; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0;
    --sand:#9A5A20; --sand-soft:#F6E8D9;
    --good:#227A50; --warn:#8A6410; --crit:#B23A30;
    --good-bg:#DFF0E7; --warn-bg:#F7EBD2; --crit-bg:#F8E1DE;
    --grid:#DCE7E7;
    --d-green:#2E9A66; --d-blue:#2F7FC9; --d-yellow:#8F6C0E;
    --d-red:#C33B35;   --d-purple:#7B4FC9; --d-orange:#B0561B;
    --shadow:0 1px 2px rgba(10,40,45,.06), 0 8px 24px rgba(10,40,45,.08);
  }
}
:root[data-theme="light"]{
  --ground:#EBF0EF; --surface:#FFFFFF; --surface-2:#F2F6F6; --surface-3:#E6EEEE;
  --line:#CBDBDB; --line-soft:#DEE8E8;
  --ink:#08181D; --ink-2:#456067; --ink-3:#6C868C;
  --accent:#0C6E78; --accent-ink:#FFFFFF; --accent-soft:#DCEEF0;
  --sand:#9A5A20; --sand-soft:#F6E8D9;
  --good:#227A50; --warn:#8A6410; --crit:#B23A30;
  --good-bg:#DFF0E7; --warn-bg:#F7EBD2; --crit-bg:#F8E1DE;
  --grid:#DCE7E7;
  --d-green:#2E9A66; --d-blue:#2F7FC9; --d-yellow:#8F6C0E;
  --d-red:#C33B35;   --d-purple:#7B4FC9; --d-orange:#B0561B;
  --shadow:0 1px 2px rgba(10,40,45,.06), 0 8px 24px rgba(10,40,45,.08);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px))}
.wrap{max-width:960px;margin:0 auto;padding:0 var(--pad)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 0 11px}
.hd h1{font-family:var(--serif);font-weight:600;font-size:18px;margin:0;letter-spacing:-.01em;
  flex:1;line-height:1.15;text-wrap:balance}
.hd h1 small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:3px}
.countdown{text-align:right;font-family:var(--mono);line-height:1.1;flex:none;
  background:none;border:0;padding:2px 0 2px 4px;border-radius:var(--r-sm)}
.countdown:hover{background:var(--surface-2)}
.countdown b{display:block;font-size:20px;color:var(--sand);font-weight:600;font-variant-numeric:tabular-nums}
.countdown span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.countdown span::after{content:" ▾";opacity:.7}
.iconbtn{background:none;border:1px solid var(--line);border-radius:var(--r-sm);width:32px;height:32px;
  display:grid;place-items:center;flex:none;color:var(--ink-2);font-size:14px}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.rail{height:3px;background:var(--line-soft);position:relative;overflow:hidden}
.rail i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent-soft),var(--accent));display:block}

/* ---------- generic ---------- */
.screen{display:none;padding-top:18px}
.screen.on{display:block}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";height:1px;flex:1;background:var(--line-soft)}
h2.sec{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13.5px;margin:0 0 14px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- capture ---------- */
.quickrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.quick{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:550;display:flex;align-items:center;gap:7px;white-space:nowrap}
.quick:hover{border-color:var(--accent);background:var(--accent-soft)}
.quick span{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:11px 9px 10px;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:112px;
  position:relative;transition:transform .1s ease,border-color .1s ease}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .em{font-size:21px;line-height:1}
.tile .nm{font-size:11.5px;font-weight:600;line-height:1.25}
.tile .cm{font-size:10px;color:var(--ink-3);line-height:1.3;margin-top:-2px}
.tile .dose{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.01em;line-height:1.2}
.tile .ds{margin-top:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.tile .strip{position:absolute;left:0;top:11px;bottom:11px;width:2px;border-radius:2px}
.tile .earns{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,12,15,.62);z-index:60;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0;border-top:1px solid var(--line);
  padding:18px var(--pad) calc(20px + env(safe-area-inset-bottom,0px));
  max-width:960px;margin:0 auto;display:none;max-height:88vh;overflow-y:auto}
.sheet.on{display:block}
.sheet h3{margin:0 0 2px;font-family:var(--serif);font-size:19px;font-weight:600}
.sheet .sh-sub{color:var(--ink-3);font-size:12.5px;margin:0 0 16px;font-family:var(--mono)}
.field{margin-bottom:13px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r-sm);padding:10px 11px;font-family:var(--sans);font-size:15px}
input[type=time],input[type=date],input[type=number]{font-family:var(--mono)}
textarea{resize:vertical;min-height:60px;font-size:14px}
.stepper{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.stepper button{background:var(--surface-2);border:0;width:52px;font-size:20px;color:var(--ink-2);line-height:1}
.stepper button:hover{background:var(--surface-3);color:var(--ink)}
.stepper input{border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
  border-radius:0;text-align:center;font-size:17px;font-weight:600;background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r-sm);
  padding:13px;font-weight:650;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--crit);color:var(--crit)}
.btnrow{display:flex;gap:9px;margin-top:6px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  padding:2px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* ══════════ BOARD ══════════ */
.identity{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:15px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.identity .id-t{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:190px}
.identity .id-t em{font-style:normal;color:var(--ink-3);display:block;font-family:var(--mono);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.identity .out{font-family:var(--mono);text-align:right;background:none;border:1px solid transparent;
  padding:6px 9px;border-radius:var(--r-sm)}
.identity .out:hover{border-color:var(--line);background:var(--surface-2)}
.identity .out b{display:block;font-size:26px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.identity .out span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.identity .out span::after{content:" ▾";opacity:.7}

/* time-unit picker */
.unitrow{display:flex;align-items:center;gap:13px;padding:12px 13px;border:1px solid var(--line-soft);
  border-radius:var(--r);background:var(--surface-2);text-align:left;width:100%}
.unitrow:hover{border-color:var(--line)}
.unitrow.on{border-color:var(--accent);background:var(--accent-soft)}
.unitrow .uv{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;
  min-width:64px;color:var(--ink)}
.unitrow.on .uv{color:var(--accent)}
.unitrow .ul{flex:1;min-width:0}
.unitrow .ul b{display:block;font-size:14px;font-weight:600}
.unitrow .ul span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}

/* today card */
.todaycard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--shadow)}
.todayhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.todayhd h3{font-family:var(--serif);font-size:18px;margin:0;font-weight:600}
.todayhd .sp{flex:1}
.xrow{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--r);margin-bottom:12px}
.xrow .xbox{width:30px;height:30px;border:2px solid var(--line);border-radius:var(--r-sm);flex:none;
  display:grid;place-items:center;font-size:17px;font-weight:700;color:transparent;background:var(--surface)}
.xrow.on .xbox{color:var(--accent);border-color:var(--accent)}
.xrow .xt{flex:1;font-size:13px;line-height:1.35}
.xrow .xt b{display:block;font-size:13.5px}
.xrow .xt span{color:var(--ink-3);font-size:11.5px}

.dotlist{display:flex;flex-direction:column;gap:7px}
.dotrow{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line-soft);
  border-radius:var(--r);background:var(--surface-2);text-align:left;width:100%}
.dotrow:hover{border-color:var(--line)}
.dotrow.on{background:var(--surface-3);border-color:currentColor}
.dotrow .dt{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid currentColor;
  background:transparent;display:grid;place-items:center;font-family:var(--mono);font-size:11px;
  font-weight:700;color:inherit;opacity:.55}
.dotrow.on .dt{background:currentColor;opacity:1}
.dotrow.on .dt b{color:var(--surface);font-weight:700}
.dotrow .dt b{color:transparent}
.dotrow .dl{flex:1;min-width:0}
.dotrow .dl b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink)}
.dotrow .dl span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.35}
.dotrow.off{opacity:.42}
.dotrow .auto{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);flex:none}

.alert{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:var(--r);
  padding:11px 13px;font-size:13px;line-height:1.4;margin-top:12px}
.alert b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:3px}
.alert.star{border-color:var(--sand);background:var(--sand-soft);color:var(--sand)}

/* legend */
.legendbar{display:flex;flex-wrap:wrap;gap:9px}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);
  letter-spacing:.06em;color:var(--ink-2);border:1px solid var(--line-soft);border-radius:999px;padding:3px 9px 3px 5px}
.lg i{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;font-size:8px;
  font-weight:700;color:var(--surface);flex:none}

/* whiteboard grid */
.boardscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.board{border-collapse:separate;border-spacing:0;table-layout:fixed;width:756px}
.board th.mo{text-align:left;font-family:var(--serif);font-size:13px;font-weight:600;
  padding:0 8px;white-space:nowrap;width:116px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-right:0;overflow:hidden}
.board th.mo em{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.board td.cell{width:34px;height:40px;padding:0;border:1px solid var(--line-soft);
  background:var(--surface);vertical-align:top;position:relative}
.board td.cell.empty{background:transparent;border-color:transparent}
.board td.cell button{width:100%;height:100%;background:none;border:0;padding:2px;display:block;position:relative}
.board .dnum{position:absolute;top:1px;left:3px;font-family:var(--mono);font-size:8.5px;
  color:var(--ink-3);line-height:1;font-variant-numeric:tabular-nums}
.board .cell.xd .dnum{color:var(--ink-2)}
.board .cell.xd::after{content:"";position:absolute;inset:3px;
  background:linear-gradient(to bottom right,transparent 46%,var(--ink-3) 46%,var(--ink-3) 54%,transparent 54%);
  opacity:.34;pointer-events:none}
.board .cell.today{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.board .cell.injury{outline:2px solid var(--d-orange);outline-offset:-2px;z-index:2}
.board .cell.star{background:var(--sand-soft)}
.board .cell.star .dnum{color:var(--sand)}
.board .cell.future{opacity:.42}
.board .cell.phasestart{border-left:3px solid var(--ink-2)}
.dotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:11px 3px 2px;
  justify-items:center;align-content:start}
.dotgrid i{width:8px;height:8px;border-radius:50%;display:block;background:transparent}
.board .cell .goalwave{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;pointer-events:none}

.monthrow-stat{font-family:var(--mono);font-size:9px;color:var(--ink-3);line-height:1.35;
  padding:4px 7px;background:var(--surface-2);border:1px solid var(--line-soft);border-left:0;
  width:96px;vertical-align:top}
.monthrow-stat b{color:var(--sand);font-size:11px}

/* ---------- dashboard ---------- */
.hero{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--shadow)}
.hero .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.hero .big{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em;
  margin:8px 0 2px;font-variant-numeric:tabular-nums}
.hero .of{font-size:15px;color:var(--ink-3);font-weight:400}
.meter{height:8px;background:var(--surface-3);border-radius:999px;margin:12px 0 8px;position:relative;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px}
.meter .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);opacity:.65}
.hero .note{font-size:12.5px;color:var(--ink-2);margin:0}
.sleepcard{background:linear-gradient(165deg,var(--surface-2),var(--surface) 62%);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:17px;box-shadow:var(--shadow)}
.sleepcard .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sleepcard .big{font-family:var(--mono);font-size:42px;font-weight:600;line-height:1;
  letter-spacing:-.02em;margin:9px 0 2px;font-variant-numeric:tabular-nums;color:var(--accent)}
.sleepcard .big small{font-size:15px;color:var(--ink-3);font-weight:400;letter-spacing:0}
.sleepcard .when{font-size:12.5px;color:var(--ink-2);margin:0 0 14px}
.sleepcard .stale{font-size:11.5px;color:var(--ink-3);margin:13px 0 0;padding-top:11px;
  border-top:1px solid var(--line-soft);line-height:1.45}
.sleepcard .stale b{font-weight:600;color:var(--ink-2);font-family:var(--mono);font-variant-numeric:tabular-nums}
/* ── ASRM QUESTIONNAIRE ──
   Radio semantics without radio chrome: one option per group is `aria-checked`,
   arrow keys move within a group, and the group is a real radiogroup so a
   screen reader announces "3 of 5". */
.qgroup{border:1px solid var(--line-soft);border-radius:var(--r);padding:12px;margin-bottom:11px;
  background:var(--surface-2)}
.qgroup.answered{border-color:var(--line)}
.qhead{display:flex;align-items:baseline;gap:8px;margin:0 0 9px}
.qhead b{font-size:14px;font-weight:600}
.qhead .qn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3)}
.qhead .qs{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.qopt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:5px;
  color:var(--ink-2);font:inherit;font-size:13px;line-height:1.4;cursor:pointer}
.qopt:last-child{margin-bottom:0}
.qopt .rad{flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);
  margin-top:1px;position:relative}
.qopt[aria-checked="true"]{border-color:var(--d-purple);background:var(--surface-3);color:var(--ink)}
.qopt[aria-checked="true"] .rad{border-color:var(--d-purple)}

/* ══════════ DASHBOARD — Oura-app idiom ══════════

.ringrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;

/* ── GOLD STAR CELEBRATION ──
   Fires once, the moment the last required dot lands. Everything is transform
   and opacity so it stays on the compositor; prefers-reduced-motion drops the
   spin and the rays and simply fades the card in. */
.starburst[hidden]{display:none}
.starburst{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(4,12,15,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:sb-in .28s ease both;padding:24px}
.starburst .sbcard{position:relative;text-align:center;max-width:340px;width:100%;
  background:linear-gradient(168deg,var(--surface-2),var(--surface) 66%);
  border:1px solid var(--sand);border-radius:22px;padding:30px 24px 24px;box-shadow:var(--shadow);
  animation:sb-card .5s cubic-bezier(.2,1.3,.4,1) both}
.starburst .rays{position:absolute;left:50%;top:74px;width:230px;height:230px;margin:-115px 0 0 -115px;
  pointer-events:none;z-index:0}
.starburst .rays i{position:absolute;left:50%;top:50%;width:3px;height:74px;border-radius:2px;
  background:linear-gradient(to top,transparent,var(--sand));transform-origin:50% 100%;opacity:0;
  animation:sb-ray .9s ease-out both}
.starburst .glyph{position:relative;font-size:78px;line-height:1;display:block;
  filter:drop-shadow(0 6px 16px rgba(240,182,127,.45));
  animation:sb-pop .72s cubic-bezier(.18,1.5,.4,1) both}
.starburst .glyph::after{content:"";position:absolute;inset:-8% -30%;border-radius:50%;
  background:radial-gradient(circle,rgba(240,182,127,.42),transparent 66%);z-index:-1;
  animation:sb-halo 1.1s ease-out both}
.starburst .glyph,.starburst h3,.starburst .sbsub,.starburst .sbdots,
.starburst .sbmeta,.starburst .btnrow{position:relative;z-index:1}
.starburst h3{font-family:var(--serif);font-size:26px;margin:16px 0 4px;font-weight:600;color:var(--sand)}
.starburst .sbsub{font-size:13.5px;color:var(--ink-2);margin:0 0 16px;line-height:1.5}
.starburst .sbdots{display:flex;gap:7px;justify-content:center;margin:0 0 18px}
.starburst .sbdots i{width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 2px var(--surface);
  animation:sb-dot .4s ease-out both}
.starburst .sbmeta{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 18px}
@keyframes sb-in{from{opacity:0}to{opacity:1}}
@keyframes sb-card{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes sb-pop{0%{opacity:0;transform:scale(.2) rotate(-140deg)}
  60%{opacity:1;transform:scale(1.18) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes sb-halo{0%{opacity:0;transform:scale(.4)}45%{opacity:1}100%{opacity:.35;transform:scale(1.25)}}
@keyframes sb-ray{0%{opacity:0;transform:rotate(var(--a)) translateY(-14px) scaleY(.2)}
  45%{opacity:.85}100%{opacity:0;transform:rotate(var(--a)) translateY(-56px) scaleY(1)}}
@keyframes sb-dot{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .starburst,.starburst .sbcard,.starburst .glyph,.starburst .sbdots i{animation:sb-in .2s ease both}
  .starburst .glyph::after{animation:none;opacity:.35}
  .starburst .rays{display:none}
}

   with five statements each scored 0 to 4, so the total runs 0 to 20. The
   published screening threshold is 6: at that cut the scale reaches 85.5%
   sensitivity and 87.3% specificity for mania. It is a SCREEN, not a
   diagnosis, and it does not replace Dr. Cameron.

   questions because the words are doing precise work: "occasionally" means
   once or twice, "often" means several times or more, "frequently" means most

   been reworded is no longer the instrument that was validated. */

    "I do not feel happier or more cheerful than usual.",
    "I occasionally feel happier or more cheerful than usual.",
    "I often feel happier or more cheerful than usual.",
    "I feel happier or more cheerful than usual most of the time.",
    "I feel happier or more cheerful than usual all of the time."]},
  {k:"Self-confidence", o:[
    "I do not feel more self-confident than usual.",
    "I occasionally feel more self-confident than usual.",
    "I often feel more self-confident than usual.",
    "I feel more self-confident than usual.",
    "I feel extremely self-confident all of the time."]},
  {k:"Sleep patterns", o:[
    "I do not need less sleep than usual.",
    "I occasionally need less sleep than usual.",
    "I often need less sleep than usual.",
    "I frequently need less sleep than usual.",
    "I can go all day and night without any sleep and still not feel tired."]},
  {k:"Speech", o:[

    "I occasionally talk more than usual.",
    "I often talk more than usual.",
    "I frequently talk more than usual.",

    "I have occasionally been more active than usual.",
    "I have often been more active than usual.",
    "I have frequently been more active than usual.",
    "I am constantly active or on the go all the time."]}
];

       say:"Scores of 0 to 5 are unlikely to indicate manic symptoms. Keep the baseline — a score "+
           "only means something next to the ones before it."};
}

/* payload arrives in the URL fragment, so the data never leaves the link */
const b64d = s => { s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  const bin=atob(s), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
async function decodePayload(raw){
  const kind=raw[0], bytes=b64d(raw.slice(1));
  if(kind==="g"){
    if(typeof DecompressionStream==="undefined") throw new Error("no gzip");
    const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(st).text());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function hydrate(){
  const m=/[#&]d=([^&]+)/.exec(location.hash);
  if(!m) return;
  try{
    const p=await decodePayload(decodeURIComponent(m[1]));
    state.entries=(p.e||[]).map((a,i)=>({uid:"h"+i,date:a[0],time:a[1],id:a[2],q:a[3],note:a[4]||""}));
    state.daily=p.daily||{}; state.done=p.done||{}; state.board=p.board||{};
    if(p.settings) Object.assign(state.settings,p.settings);
    SHARE.mode=p.mode||"clinical"; SHARE.ts=p.ts||null;
  }catch(e){ SHARE.error=true; }
}

/* ════════ HELPERS ════════ */
const pad2 = n => String(n).padStart(2,"0");
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function nowHM(){ const d=new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function parseISO(x){ const [y,m,d]=x.split("-").map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/864e5); }
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
function longDate(iso){ const d=parseISO(iso); return MON[d.getMonth()]+" "+d.getDate(); }
function shortDate(iso){ const d=parseISO(iso); return MON[d.getMonth()].slice(0,3)+" "+d.getDate(); }
function dow(iso){ return DOW[parseISO(iso).getDay()]; }
function h12(hm){ const [H,M]=hm.split(":").map(Number); const ap=H<12?"am":"pm"; let h=H%12; if(!h) h=12;
  return h+":"+pad2(M)+" "+ap; }
function timeOfDay(hm){ const H=Number(hm.split(":")[0]);
  return H<5?"Overnight":H<8?"Early morning":H<12?"Morning":H<17?"Afternoon":H<21?"Evening":"Night"; }
function fmtQty(q,unit){ const n=(Math.round(q*100)/100).toString();
  return unit ? n+" "+unit+(q!==1 && unit.length>2 && unit.length<7 && !unit.endsWith("s")?"s":"") : n; }
function esc(x){ return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2200); }

function phaseOn(iso){
  for(const p of PHASES) if(iso>=p.from && iso<=p.to) return p;
  return iso<PHASES[0].from ? PHASES[0] : PHASES[PHASES.length-1];
}
function liveDots(iso){
  const p = phaseOn(iso);
  return p.goal ? PHASES[PHASES.length-2].live : p.live;
}

/* first phase in which a dot counts toward a full day */
function phaseFirstLive(id){

/* ── dose maths ── */
function apapMg(e){ const c=BY_ID[e.id]; if(!c||!c.mgApap) return 0;
  return (c.id==="apap" ? state.settings.apapTab : c.mgApap) * e.q; }
function dayStats(iso){
  const rows = state.entries.filter(e=>e.date===iso);
  let apap=0,opioid=0,codeine=0,rehabN=0;
  rows.forEach(e=>{ const c=BY_ID[e.id]; if(!c) return;
    apap+=apapMg(e);
    if(c.opioid){ opioid+=e.q; if(c.mgCodeine) codeine+=c.mgCodeine*e.q; }
    if(c.g==="rehab"||c.g==="fit") rehabN++;
  });
  const d = state.daily[iso]||{};
  return {iso, rows, apap, opioid, codeine, rehabN, sleepH:d.sleepH, daily:d};
}
function apapLevel(mg){ const l=state.settings.apapLimit;
  return mg>l ? "crit" : mg>=l*0.75 ? "warn" : "good"; }

/* ── DOT DERIVATION ──
   auto  = earned by what you logged
   man   = manually forced on/off (overrides auto) */
function autoDots(iso){
  const st = dayStats(iso);
  const ids = new Set(st.rows.map(e=>e.id));
  const out = {};
  st.rows.forEach(e=>{
    const c = BY_ID[e.id]; if(!c) return;
    if(c.dot)  out[c.dot]=true;
    if(c.also) out[c.also]=true;
  });
  /* REHAB and STRENGTH are counting rules over their capture sections: two
     DISTINCT items in a section earns its dot. Logging the same thing twice
     is not two items. The rings workout is the single exception — it carries
     STRENGTH on its own through the `dot` tag above. */
  const count = set => [...ids].filter(x=>set.has(x)).length;
  if(count(REHAB_IDS) >= 2) out.green = true;
  if(count(FIT_IDS)   >= 2) out.red   = true;
  /* RECOVER: more than 6 h of sleep, or a nap of 15 minutes or more. */
  const napMin = st.rows.filter(e=>e.id==="nap").reduce((a,e)=>a+e.q,0);
  if((st.sleepH != null && st.sleepH > 6) || napMin >= 15) out.blue = true;
  /* FUEL needs a protein source AND calcium/D on the same day */
  const protein = ids.has("protein")||ids.has("protgoal");
  const mineral = ids.has("calcium")||ids.has("vitd")||ids.has("vitstack");
  out.yellow = protein && mineral;
  /* anything flagged `blocks` kills its dot for the day */
  st.rows.forEach(e=>{ const c=BY_ID[e.id]; if(c && c.blocks) out[c.blocks]=false; });
  return out;
}
/* ── HISTORY FREEZE ──
   The dot rules changed on the day this version shipped. Re-deriving old days
   under new rules would silently rewrite a record he has been keeping by hand
   since August, so it does not happen: every day before today that carries any
   data has its dots — as they read under the OLD rules — written into
   state.board as explicit manual values. From then on the past is a stored
   fact, and only today forward is derived. Runs exactly once. */
const LEGACY_DOT = {
  winddown:["blue"], ankle:["green"], abduct:["green"], physio:["green"],
  mobil:["green","blue"], gait:["green"], resist:["red"], upper:["red"],
  bands:["red"], singleleg:["red"], bike:["orange"], pool:["orange"],
  paddle:["orange"], crutch:["green"], wbwalk:["green","orange"], hop:["red"],
  popup:["red"], balance:["green"], breath:["purple"], journal:["purple"],
  mtherapy:["purple"], alcohol:[]
};
function legacyAutoDots(iso){
  const st = dayStats(iso);
  const ids = new Set(st.rows.map(e=>e.id));
  const out = {};
  ids.forEach(id => (LEGACY_DOT[id]||[]).forEach(d => out[d]=true));
  if(st.sleepH != null && st.sleepH >= 7) out.blue = true;
  const protein = ids.has("protein")||ids.has("protgoal");
  const mineral = ids.has("calcium")||ids.has("vitd")||ids.has("vitstack");
  out.yellow = protein && mineral;
  if(ids.has("alcohol")) out.yellow = false;
  return out;
}
function freezeHistory(){
  if(state.settings.dotRulesV2) return;
  const today = todayISO();
  const days = new Set([...state.entries.map(e=>e.date),
                        ...Object.keys(state.daily), ...Object.keys(state.board)]);
  let frozen = 0;
  [...days].filter(d => d < today).forEach(iso => {
    const auto = legacyAutoDots(iso);
    const man  = (state.board[iso] && state.board[iso].dots) || {};
    const dots = {};
    DOTS.forEach(d => { dots[d.id] = (d.id in man) ? !!man[d.id] : !!auto[d.id]; });
    state.board[iso] = Object.assign({}, state.board[iso], {dots, starShown:true});
    frozen++;
  });
  state.settings.dotRulesV2 = true;
  save();
  return frozen;
}
/* ── THE GOLD STAR MOMENT ──
   Fires once per day, at the instant the last required dot lands. `starShown`
   is stored on the day so a reload, or a dot toggled off and back on, does not
   replay it. Any log that could complete a day calls this. */
function celebrateIfStar(iso){
  if(!iso) return;
  const meta = dayMeta(iso);
  if(!meta.star) return;
  const b = state.board[iso] = state.board[iso] || {};
  if(b.starShown) return;
  b.starShown = true; save();
  showStar(iso, meta);
}
function showStar(iso, meta){
  const host = document.getElementById("starburst");
  const rays = Array.from({length:12},(_,i)=>
    '<i style="--a:'+(i*30)+'deg;animation-delay:'+(120+i*22)+'ms"></i>').join("");
  const dots = meta.earned.map((id,i)=>'<i style="background:'+dotVar(id)+
    ';animation-delay:'+(420+i*70)+'ms"></i>').join("");
  const stars = starCount();
  host.innerHTML =
    '<div class="sbcard" role="dialog" aria-live="polite" aria-label="Gold star earned">'+
      '<div class="rays">'+rays+'</div>'+
      '<span class="glyph">⭐</span>'+
      '<h3>Gold star</h3>'+
      '<p class="sbsub">Every dot this phase requires, earned on '+esc(longDate(iso))+
        '. Put a star on the square.</p>'+
      '<div class="sbdots">'+dots+'</div>'+
      '<p class="sbmeta">'+stars.total+' gold star'+(stars.total===1?"":"s")+
        ' · '+stars.streak+'-day star streak</p>'+
      '<div class="btnrow"><button class="btn" id="sbok">Nice</button></div>'+
    '</div>';
  host.hidden = false;
  const close = ()=>{ host.hidden = true; host.innerHTML=""; };
  document.getElementById("sbok").onclick = close;
  host.onclick = e => { if(e.target===host) close(); };
  document.addEventListener("keydown", function esc2(e){
    if(e.key==="Escape"){ close(); document.removeEventListener("keydown",esc2); } });
}
/* gold-star totals: every star since the injury, the run ending today, and the
   longest run on record */
function starCount(asOf){
  const today = asOf || todayISO();
  let total=0, best=0, run=0, streak=0;
  for(let iso=INJURY; iso<=today; iso=addDays(iso,1)){
    if(dayMeta(iso).star){ total++; run++; if(run>best) best=run; }
    else run=0;
  }
  streak = run;
  if(!streak){   /* today may simply not be finished yet — count back from yesterday */
    let iso = addDays(today,-1);
    while(iso>=INJURY && dayMeta(iso).star){ streak++; iso=addDays(iso,-1); }
  }
  return {total, streak, best};
}
function dayDots(iso){
  const auto = autoDots(iso);
  const man  = (state.board[iso]&&state.board[iso].dots) || {};
  const live = liveDots(iso);
  const out = {};
  /* every dot can be earned — work you actually did is never discarded.
     `live` only decides what counts toward a full day. */
  DOTS.forEach(d=>{ out[d.id] = (d.id in man) ? man[d.id] : !!auto[d.id]; });
  return {dots:out, auto, man, live};
}
function dayMeta(iso){
  const b = state.board[iso]||{};
  const {dots,auto,man,live} = dayDots(iso);
  const earned     = DOTS.filter(d=>dots[d.id]).map(d=>d.id);
  const earnedLive = live.filter(id=>dots[id]);
  const bonus      = earned.filter(id=>!live.includes(id));
  return {x: !!b.x, dots, auto, man, live, earned, earnedLive, bonus,
          star: live.length>0 && earnedLive.length===live.length,
          milestone: state.entries.some(e=>e.date===iso && BY_ID[e.id] && BY_ID[e.id].milestone)};
}
/* "Never miss twice" — a blank day makes the next day mandatory */
function mandatoryToday(){
  const y = addDays(todayISO(),-1);
  if(y < INJURY) return false;
  const ym = dayMeta(y);
  const tm = dayMeta(todayISO());
  return ym.earned.length===0 && tm.earned.length===0;
}
function dotStreak(){
  let n=0, iso=todayISO();
  if(dayMeta(iso).earned.length===0) iso = addDays(iso,-1);
  while(iso>=INJURY && dayMeta(iso).earned.length>0){ n++; iso=addDays(iso,-1); }
  return n;
}
function monthStats(y,m){
  const first = y+"-"+pad2(m)+"-01";
  const days = new Date(y,m,0).getDate();
  let perfect=0, marked=0, dots=0;
  for(let d=1; d<=days; d++){
    const iso = y+"-"+pad2(m)+"-"+pad2(d);
    if(iso < INJURY || iso > todayISO()) continue;
    const meta = dayMeta(iso);
    if(meta.earned.length){ marked++; dots+=meta.earned.length; }
    if(meta.star) perfect++;
  }
  return {perfect, marked, dots, first};
}
function allDates(){
  const s2 = new Set(state.entries.map(e=>e.date));
  Object.keys(state.daily).forEach(d=>s2.add(d));
  Object.keys(state.board).forEach(d=>s2.add(d));
  return [...s2].sort().reverse();
}

/* ── RING GAUGE ──
   One value against its own ceiling. A recessive track, one coloured arc, the
   number in the middle. `pct` is 0–1; anything past 1 fills the ring and is
   reported by the number, not by a second lap. */
function ringGauge(pct, color, size, stroke){
  size = size||58; stroke = stroke||5;
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const v = Math.max(0, Math.min(1, pct||0));
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" aria-hidden="true">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r.toFixed(2)+'" fill="none" '+
      'stroke="var(--surface-3)" stroke-width="'+stroke+'"/>'+
    (v>0?'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r.toFixed(2)+'" fill="none" stroke="'+color+
      '" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+
      (c*v).toFixed(2)+' '+c.toFixed(2)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>':'')+
    '</svg>';
}
/* The big one on the focus card: a 240° arc, open at the bottom, in the Oura
   idiom — the shape reads as "a dial", not "a pie". */
function arcGauge(pct){
  const W=184, H=114, cx=W/2, cy=94, r=76, span=240, start=-210;
  const pol=(a,rr)=>[cx+rr*Math.cos(a*Math.PI/180), cy+rr*Math.sin(a*Math.PI/180)];
  const arc=(from,to,rr)=>{ const [x1,y1]=pol(from,rr), [x2,y2]=pol(to,rr);
    return "M"+x1.toFixed(1)+","+y1.toFixed(1)+"A"+rr+","+rr+" 0 "+((to-from)>180?1:0)+" 1 "+
      x2.toFixed(1)+","+y2.toFixed(1); };
  const v = Math.max(0, Math.min(1, pct||0));
  const gold = v>=1;   /* a full dial is drawn in gold rather than accent */
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="100%" aria-hidden="true">'+
    '<path d="'+arc(start,start+span,r)+'" fill="none" stroke="var(--surface-3)" stroke-width="7" stroke-linecap="round"/>'+
    (v>0?'<path d="'+arc(start,start+span*v,r)+'" fill="none" stroke="'+
      (gold?"var(--sand)":"var(--accent)")+'" stroke-width="7" stroke-linecap="round"/>':'')+
    '</svg>';
}
/* ── ASRM OVER TIME ──
   Scores are irregular by nature — you take one when you think to — so the
   x-axis is the reading, not the calendar, and each point carries its date.
   The threshold line at 6 is the only reference that means anything. */
function asrmChart(rows){
  const W=640,H=180,mL=30,mR=12,mT=14,mB=30,iw=W-mL-mR,ih=H-mT-mB,max=ASRM_MAX;
  const y=v=>mT+ih-(v/max)*ih, x=i=>mL+(rows.length===1?iw/2:(i/(rows.length-1))*iw);
  const g=[0,5,10,15,20].map(v=>'<line x1="'+mL+'" x2="'+(W-mR)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+
    '" stroke="var(--grid)" stroke-width="1"/><text x="'+(mL-7)+'" y="'+(y(v)+3.5).toFixed(1)+
    '" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--ink-3)">'+v+'</text>').join("");
  const cut='<rect x="'+mL+'" y="'+mT+'" width="'+iw+'" height="'+(y(ASRM_CUT)-mT).toFixed(1)+
    '" fill="var(--warn)" opacity=".10"/>'+
    '<line x1="'+mL+'" x2="'+(W-mR)+'" y1="'+y(ASRM_CUT).toFixed(1)+'" y2="'+y(ASRM_CUT).toFixed(1)+
    '" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>'+
    '<text x="'+(mL+5)+'" y="'+(y(ASRM_CUT)-5).toFixed(1)+'" text-anchor="start" '+
    'font-family="var(--mono)" font-size="9" fill="var(--warn)">6 · screening threshold</text>';
  if(!rows.length) return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+g+cut+'<text x="'+(W/2)+'" y="'+
    (H/2+18)+'" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink-3)">'+
    'no scores recorded yet</text></svg>';
  const line=rows.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(r.q).toFixed(1)).join(" ");
  const pts=rows.map((r,i)=>{ const last=i===rows.length-1, over=r.q>=ASRM_CUT;
    return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(r.q).toFixed(1)+'" r="'+(last?5.5:4.5)+'" fill="'+
      (over?"var(--warn)":(last?"var(--d-purple)":"var(--surface)"))+'" stroke="'+
      (over?"var(--warn)":"var(--d-purple)")+'" stroke-width="2"/>'+
      '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(r.q).toFixed(1)+'" r="12" fill="transparent" data-tip="'+
      esc(shortDate(r.date))+'|'+r.q+' / '+ASRM_MAX+'|'+esc(asrmBand(r.q).short)+'"/>'; }).join("");

function wireHover(){
  const tip=document.getElementById("tip");
  document.querySelectorAll("svg.chart [data-tip]").forEach(el=>{
    const show=ev=>{
      const [a,b,c]=el.dataset.tip.split("|");
      tip.innerHTML='<b>'+esc(a)+'</b><div class="tv">'+esc(b)+'</div>'+
        (c?'<div style="font-size:11px;margin-top:2px;color:var(--ink-2)">'+esc(c)+'</div>':'');
      tip.classList.add("on");
      const p=ev.touches?ev.touches[0]:ev, w=tip.offsetWidth;
      tip.style.left=Math.max(8,Math.min(window.innerWidth-w-8,p.clientX-w/2))+"px";
      tip.style.top=Math.max(8,p.clientY-tip.offsetHeight-14)+"px";
    };
    el.addEventListener("mouseenter",show); el.addEventListener("mousemove",show);
    el.addEventListener("touchstart",show,{passive:true});
    el.addEventListener("mouseleave",()=>tip.classList.remove("on"));
  });
  document.addEventListener("touchend",()=>document.getElementById("tip").classList.remove("on"),{passive:true});
}

function trend(now,prev){
  if(!prev&&!now) return "none either week";
  if(!prev) return "up from none last week";
  const pc=Math.round((now-prev)/prev*100);
  if(!pc) return "flat on last week";
  return (pc>0?"up ":"down ")+Math.abs(pc)+"% on last week"+(pc<0?" — good":"");
}
function lastN(n){ const o=[],t=todayISO(); for(let i=n-1;i>=0;i--) o.push(addDays(t,-i)); return o; }
/* Most recent night with sleep on it. Oura keys a night to the day you woke. */
function lastNight(){
  const days=Object.keys(state.daily).filter(d=>state.daily[d]&&state.daily[d].sleepH!=null).sort();
  if(!days.length) return null;
  const iso=days[days.length-1];
  const sessions=state.entries
    .filter(e=>e.date===iso&&(e.id==="sleep_long"||e.id==="sleep_nap"))

function hm(hours){ const h=Math.floor(hours), m=Math.round((hours-h)*60);

/* ════════ MEDICATION SUMMARY — what a clinician opens this for ════════ */
function medSummary(days){
  const win=lastN(days), set=new Set(win);
  const agg={};
  state.entries.filter(e=>set.has(e.date)).forEach(e=>{
    const c=BY_ID[e.id]; if(!c) return;

    {v:Math.round(dayPct*100), u:"", l:"Day", p:dayPct, c:metaD.star?"var(--sand)":"var(--accent)"},
    {v:nightD!=null?(Math.round(nightD*10)/10):"—", u:nightD!=null?"h":"", l:"Sleep",
     p:nightD!=null?nightD/9:0, c:"var(--d-blue)"},
    {v:stars.streak, u:"", l:"Star streak", p:stars.streak/7, c:"var(--sand)"},
    {v:Math.round(apapPct), u:"%", l:"Tylenol", p:apapPct/100, c:apapCol},
    {v:Math.round(phPct*100), u:"%", l:phD.name.charAt(0)+phD.name.slice(1).toLowerCase(), p:phPct, c:"var(--d-purple)"}
  ].map(r=>'<div class="ringitem"><div class="rg">'+ringGauge(r.p, r.c)+
    '<span class="rgv">'+esc(String(r.v))+(r.u?'<small>'+r.u+'</small>':'')+'</span></div>'+
    '<span class="rgl">'+esc(r.l)+'</span></div>').join("")+'</div>';

  const stripDays = []; for(let k=29;k>=0;k--) stripDays.push(addDays(asOfD,-k));
  const strip = stripDays.map(d=>{
    if(d<INJURY) return '<i></i>';
    const m=dayMeta(d);
    return '<i class="'+(m.star?"g":m.earned.length?"d":"")+'" title="'+esc(shortDate(d))+
      ' · '+m.earned.length+' dots">'+(m.star?"★":"")+'</i>'; }).join("");
  const totalDays = Math.max(1, daysBetween(INJURY,asOfD)+1);
  const starCard =
    '<div class="starcard"><div class="sh"><b>'+stars.streak+'</b>'+
      '<span>day gold-star streak — every dot the phase requires, earned</span></div>'+
      '<div class="sst">'+strip+'</div>'+
      '<p class="sfoot"><span><b>'+stars.total+'</b> gold stars total</span>'+
        '<span>best run <b>'+stars.best+'</b> days</span>'+
        '<span><b>'+Math.round(stars.total/totalDays*100)+'%</b> of days since the break</span></p></div>';

  /* The reader may open this link days after it was made, so the card is
     honest about the snapshot, not about their clock: "last night" is the
     night that ended on the snapshot date. An older reading never takes the
     headline — it is filed underneath where it cannot be misread as current. */
  const asOf = SHARE.ts || todayISO();
  const ln = lastNight();
  const stale = ln ? daysBetween(ln.iso, asOf) : null;
  const nightOf = i => shortDate(addDays(i,-1))+" → "+shortDate(i);
  const ouraGrid = r => '<div class="oura">'+[
      r && r.eff!=null     ? ['Efficiency',  r.eff+'<em>%</em>'] : null,
      r && r.rhr!=null     ? ['Resting HR',  r.rhr+'<em> bpm</em>'] : null,
      r && r.deepMin!=null ? ['Deep sleep',  r.deepMin+'<em> min</em>'] : null,
      r && r.latency!=null ? ['Latency',     r.latency+'<em> min</em>'] : null,
      r && r.score!=null   ? ['Sleep score', String(r.score)] : null,
    ].filter(Boolean).map(([k,v])=>
      '<div><span class="k">'+esc(k)+'</span><span class="v">'+v+'</span></div>').join('')+'</div>';
  const sleepCard = ln && stale===0
    ? '<div class="sleepcard">'+
        '<span class="lbl">Last night’s sleep'+
          (ln.src==="oura"?'<span class="pill accent">Oura</span>':'<span class="pill neutral">by hand</span>')+
        '</span>'+
        '<div class="big">'+hm(ln.sleepH)+'</div>'+
        '<p class="when">Night of '+esc(nightOf(ln.iso))+
          (ln.sessions.length>1?' · '+ln.sessions.length+' sessions':'')+'</p>'+
        ouraGrid(ln)+
        (ln.sessions.length>1
          ? '<div class="sessrow">'+ln.sessions.map(e=>
              '<span>'+(BY_ID[e.id]||{}).em+' '+h12(e.time)+' · '+hm(e.q)+'</span>').join('')+'</div>'
          : '')+
      '</div>'
    : '<div class="sleepcard">'+
        '<span class="lbl">Last night’s sleep'+
          (ln?'<span class="pill warn">not recorded</span>':'')+'</span>'+
        '<div class="big" style="color:var(--ink-3)">—</div>'+
        '<p class="when">'+(ln
          ? 'No sleep on the night of '+esc(nightOf(asOf))+', the last night this snapshot covers.'
          : 'No sleep recorded in this snapshot.')+'</p>'+
        (ln
          ? '<p class="stale">Most recent reading was <b>'+hm(ln.sleepH)+'</b> on the night of '+
            esc(nightOf(ln.iso))+', '+stale+' night'+(stale===1?'':'s')+' before the snapshot.</p>'
          : '')+
      '</div>';

  document.getElementById("dashBody").innerHTML=
    ringRow+starCard+sleepCard+
    '<div class="hero"><span class="lbl">Acetaminophen · all sources · '+
      (isToday?"today":esc(longDate(shown.iso))+" · last day with doses")+'</span>'+
      '<div class="big" style="color:'+col+'">'+shown.apap.toLocaleString()+
        ' <span class="of">/ '+lim.toLocaleString()+' mg</span></div>'+
      '<div class="meter"><i style="width:'+pct+'%;background:'+col+'"></i>'+
        '<span class="tick" style="left:75%"></span></div>'+
      '<p class="note">Counts plain Tylenol at '+state.settings.apapTab+
      ' mg a tablet plus 300 mg in every Tylenol No. 3.'+
      (shown.codeine?' Codeine that day: '+shown.codeine+' mg.':'')+'</p></div>'+
    '<div class="card"><figcaption><div class="t">Active medications, last 7 days</div>'+
      '<div class="s">Everything logged in the pain, anticoagulant, sleep, supplement and cannabis groups</div></figcaption>'+
      '<div class="tblbox" style="border:0"><table class="meds"><thead><tr>'+
      '<th>Drug / compound</th><th>Total</th><th>Days used</th><th>Purpose</th></tr></thead>'+
      '<tbody>'+medRows+'</tbody></table></div></div>'+
    '<div class="tiles">'+tiles.map(t=>'<div class="stat"><span class="k">'+esc(t.k)+'</span>'+
      '<div class="v">'+esc(String(t.v))+(t.s?' <small>'+esc(t.s)+'</small>':'')+'</div>'+
      '<div class="d">'+esc(t.d)+'</div></div>').join("")+'</div>'+
    (asrmAll.length
      ? '<div class="card"><figure><figcaption><div class="t">Mania self-rating (Altman), all scores</div>'+
        '<div class="s">Self-administered, 0–20. Six or more is the published screening threshold '+
        '(85.5% sensitivity, 87.3% specificity for mania). A screen, not a diagnosis.</div></figcaption>'+
        '<div class="chartbox">'+asrmChart(asrmAll.slice(-24))+'</div></figure></div>'
      : '')+
    '<div class="card"><figure><figcaption><div class="t">Daily acetaminophen, 14 days</div>'+
      '<div class="s">Dashed line is the '+lim.toLocaleString()+' mg daily ceiling</div></figcaption>'+
      '<div class="chartbox">'+apapChart(d14,lim)+'</div>'+
      '<div class="legend"><span><i style="background:var(--good)"></i>Under 75% of ceiling</span>'+
      '<span><i style="background:var(--warn)"></i>75–100%</span>'+
      '<span><i style="background:var(--crit)"></i>Over ceiling</span>'+
      '<span><i class="ln"></i>Ceiling</span></div></figure></div>'+
    '<div class="card"><figure><figcaption><div class="t">Sleep, 14 days</div>'+
      '<div class="s">Measured by Oura ring. Bone healing happens largely in slow-wave sleep.</div></figcaption>'+
      '<div class="chartbox">'+sleepChart(d14)+'</div></figure></div>'+
    '<div class="card"><figure><figcaption><div class="t">Habit adherence, 14 days</div>'+
      '<div class="s">Daily training dots, stacked by category</div></figcaption>'+
      '<div class="chartbox">'+dotChart(lastN(14))+'</div>'+
      '<div class="legend">'+DOTS.map(d=>'<span><i style="background:'+dotVar(d.id)+'"></i>'+d.name+'</span>').join("")+
      '</div></figure></div>'+
    '<div class="card"><span class="mono" style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)">Current phase</span>'+
      '<h3 style="font-family:var(--serif);font-size:19px;margin:6px 0 3px;font-weight:600">'+ph.em+' '+esc(ph.name)+'</h3>'+
      '<p style="margin:0 0 10px;font-size:13px;color:var(--ink-2)">'+esc(ph.job)+'</p>'+
      '<p class="mono" style="margin:0;font-size:11px;color:var(--ink-3)">'+esc(shortDate(ph.from))+' → '+esc(shortDate(ph.to))+'</p></div>'+
    '<p class="disclaimer">A personal log kept by Justin, not a clinical record. Doses are self-reported and '+
    'may be incomplete. 4,000 mg a day is the common adult acetaminophen maximum; clinicians often set '+
    '3,000 mg or lower with alcohol, liver concerns, or long courses.</p>';
  wireHover();
}
function renderLedger(){
  const host=document.getElementById("ledger"), dates=allDates();
  if(!dates.length){ host.innerHTML='<div class="card"><p class="muted" style="margin:0">Nothing logged.</p></div>'; return; }
  const notes=showNotes();
  host.innerHTML=dates.map(iso=>{
    const st=dayStats(iso), meta=dayMeta(iso);
    const rows=st.rows.slice().sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
    const lvl=apapLevel(st.apap);
    const dotsHtml=meta.earned.length?'<span class="dots">'+meta.earned.map(id=>
      '<i style="background:'+dotVar(id)+'" title="'+DOT_BY[id].name+'"></i>').join("")+'</span>':"";
    const pills=[
      meta.star?'<span class="pill" style="background:var(--sand-soft);color:var(--sand);border-color:var(--sand)">★ perfect</span>':'',
      st.apap?'<span class="pill '+lvl+'">APAP '+st.apap.toLocaleString()+' mg</span>':'',
      st.opioid?'<span class="pill neutral">Opioid × '+(Math.round(st.opioid*10)/10)+'</span>':'',
      st.sleepH!=null?'<span class="pill '+(st.sleepH<7?"warn":"good")+'">Sleep '+st.sleepH+' h</span>':''
    ].join(" ");
    let lastTod="";
    const body=rows.map(e=>{
      const c=BY_ID[e.id]||{em:"•",name:e.id,fx:"",unit:""};
      const tod=timeOfDay(e.time), tag=tod!==lastTod?'<span class="tod">'+tod+'</span>':''; lastTod=tod;
      const mg=apapMg(e);
      return '<tr><td class="t">'+h12(e.time)+tag+'</td>'+
        '<td class="q">'+(c.unit===""?"—":fmtQty(e.q,c.unit))+'</td>'+
        '<td class="n">'+c.em+' '+esc(c.name)+
          (c.common&&c.common!=="—"?'<em>'+esc(c.common)+(c.dose&&c.dose!=="—"?' · '+esc(c.dose):'')+'</em>':'')+'</td>'+
        '<td class="e"><span class="pill neutral">'+esc(c.fx||"—")+'</span>'+
          (mg?'<br><span class="mono" style="font-size:10px;color:var(--ink-3)">'+mg.toLocaleString()+' mg APAP</span>':'')+'</td>'+
        (notes?'<td class="no">'+(e.note?esc(e.note):'<span class="muted">—</span>')+'</td>':'')+'</tr>';
    }).join("");
    const d0=st.daily;
    const bits=[d0.eff!=null?d0.eff+"% efficiency":null,
                d0.rhr!=null?d0.rhr+" bpm resting":null,
                d0.deepMin!=null?d0.deepMin+" min deep":null,
                d0.latency!=null?d0.latency+" min latency":null,
                d0.score!=null?"score "+d0.score:null].filter(Boolean).join(" · ");
    const dnote = d0.sleepH!=null
      ? '<tr><td class="t muted">night</td><td class="q">'+d0.sleepH+' h</td>'+
        '<td class="n">🌙 Total sleep<em>'+(d0.src==="oura"?"Oura ring · imported":"logged by hand")+'</em></td>'+
        '<td class="e"><span class="pill '+(d0.sleepH<7?"warn":"good")+'">Sleep</span></td>'+
        (notes?'<td class="no">'+(d0.note?esc(d0.note)+(bits?'<br><span class="mono" style="font-size:10px;'+
          'color:var(--ink-3)">'+esc(bits)+'</span>':''):esc(bits||"—"))+'</td>':'')+'</tr>'
      : ((notes&&d0.note)?'<tr><td class="t muted">—</td><td class="q">—</td>'+
        '<td class="n">🌙 Sleep report<em>'+(d0.src==="oura"?"Oura ring · imported":"logged by hand")+'</em></td>'+
        '<td class="e"><span class="pill neutral">Metrics</span></td>'+
        '<td class="no">'+esc(d0.note)+'</td></tr>':'');
    return '<div class="day"><div class="dayhd"><h3>'+esc(longDate(iso))+'</h3>'+
      '<span class="dow">'+esc(dow(iso))+' · day '+daysBetween(INJURY,iso)+'</span>'+dotsHtml+
      '<span class="sp"></span>'+pills+'</div>'+
      '<div class="tblbox"><table class="log"><thead><tr><th>Time</th><th>Qty</th>'+
      '<th>Drug / compound / activity</th><th>Desired effect</th>'+(notes?'<th>Notes</th>':'')+
      '</tr></thead><tbody>'+body+dnote+'</tbody></table></div></div>';
  }).join("");
}
function buildCSV(){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const notes=showNotes();
  const head=["Date","Day of week","Day since injury","Phase","Time","Time of day","Quantity","Unit",
    "Drug / compound / activity","Common name","Strength","Class","Desired effect",
    "Acetaminophen (mg)","Opioid dose"]; if(notes) head.push("Notes");
  const lines=[head.map(q).join(",")];
  state.entries.slice().sort((a,b)=>(b.date+b.time)<(a.date+a.time)?-1:(b.date+b.time)>(a.date+a.time)?1:0)
    .forEach(e=>{
      const c=BY_ID[e.id]||{}, g=GROUPS.find(x=>x.id===c.g);
      const row=[e.date,dow(e.date),daysBetween(INJURY,e.date),phaseOn(e.date).name,e.time,timeOfDay(e.time),
        e.q,c.unit||"",c.name||e.id,(c.common&&c.common!=="—")?c.common:"",(c.dose&&c.dose!=="—")?c.dose:"",
        g?g.label:"",c.fx||"",apapMg(e)||"",c.opioid?e.q:""];
      if(notes) row.push(e.note||"");
      lines.push(row.map(q).join(","));
    });
  lines.push("");
  const h2=["Date","Day of week","Phase","Sleep (h)","Pain 0-10","Total acetaminophen (mg)","Opioid doses","Dots earned"];
  if(notes) h2.push("Note");
  lines.push(h2.map(q).join(","));
  allDates().forEach(iso=>{
    const st=dayStats(iso), m=dayMeta(iso), d=st.daily;
    const row=[iso,dow(iso),phaseOn(iso).name,d.sleepH??"",d.pain??"",st.apap,
      Math.round(st.opioid*10)/10,m.earnedLive.length+" / "+m.live.length];
    if(notes) row.push(d.note||"");
    lines.push(row.map(q).join(","));
  });
  return lines.join("\r\n");
}
function renderPlan(){
  const iso=todayISO(), cur=phaseOn(iso), r=remaining();
  const total=daysBetween(INJURY,GOAL), gone=daysBetween(INJURY,iso);
  document.getElementById("planBody").innerHTML=
    '<div class="goalcard"><h3>🏄 Surfing with his daughter</h3>'+
      '<p>Hawaii, '+longDate(GOAL)+' 2027. '+r.label+' — day '+gone+' of '+total+', '+
      Math.round(gone/total*100)+'% of the way there.</p>'+
      '<div class="prog"><i style="width:'+Math.round(gone/total*100)+'%"></i></div></div>'+
    '<div class="card">'+PHASES.map(p=>{
      const done=p.to<iso, now=p.id===cur.id;
      const cls=p.goal?"goal":now?"now":done?"done":"";
      const t=p.ms.filter(m=>state.done[p.id+"|"+m]).length;
      return '<div class="phase '+cls+'"><h4>'+p.em+' '+esc(p.name)+
        (now?' <span class="pill accent">current</span>':'')+
        ' <span class="pill neutral">'+t+'/'+p.ms.length+'</span></h4>'+
        '<div class="when">'+esc(shortDate(p.from))+' – '+esc(shortDate(p.to))+'</div>'+
        '<p class="job">'+esc(p.job)+'</p>'+
        (p.detail?'<p>'+esc(p.detail)+'</p>':'')+
        (p.why?'<p style="border-left:2px solid var(--sand);padding-left:11px;color:var(--ink-2)">'+esc(p.why)+'</p>':'')+
        p.ms.map(m=>{ const on=!!state.done[p.id+"|"+m];
          return '<div class="msv'+(on?" done":"")+'"><i>'+(on?"✓":"○")+'</i><span>'+esc(m)+'</span></div>'; }).join("")+
        '</div>';
    }).join("")+'</div>'+
    '<p class="disclaimer">These are calendar phases, not clinical clearance. Loading progression is the '+
    'surgeon’s call based on imaging. The whiteboard never overrides the x-ray.</p>';
}
function renderHeader(){
  const iso=todayISO(), r=remaining();
  document.getElementById("cdOut").textContent=r.value;
  document.getElementById("cdUnit").textContent=r.unit.plural;
  const ph=phaseOn(iso);
  document.getElementById("phaseName").textContent=ph.em+" "+ph.name;
  const total=daysBetween(INJURY,GOAL), gone=Math.max(0,Math.min(total,daysBetween(INJURY,iso)));
  document.getElementById("railFill").style.width=(gone/total*100)+"%";
}
function renderAll(){ renderHeader(); renderBanner(); renderDash(); renderLedger(); renderPlan(); }

document.querySelectorAll("nav.tabs button").forEach(b=> b.onclick=()=>{
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); document.getElementById("s-"+b.dataset.tab).classList.add("on");
  window.scrollTo({top:0,behavior:"instant"});
});
document.getElementById("cdBtn").onclick=openTimeUnit;
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("themeBtn").onclick=()=>{
  const c=document.documentElement.getAttribute("data-theme");
  const n=c==="light"?"dark":c==="dark"?null:"light";
  if(n) document.documentElement.setAttribute("data-theme",n);
  else document.documentElement.removeAttribute("data-theme");
  toast(n?n[0].toUpperCase()+n.slice(1)+" theme":"Following your system theme");
};
document.getElementById("copyCsv").onclick=async()=>{
  const csv=buildCSV();
  try{ await navigator.clipboard.writeText(csv); toast("CSV copied — paste into Sheets or Excel"); }
  catch(e){
    showSheet('<h3>CSV</h3><p class="sh-sub">Select all and copy</p>'+
      '<textarea class="csvout" readonly>'+esc(csv)+'</textarea>'+
      '<div class="btnrow"><button class="btn" id="cancel">Done</button></div>');
    document.getElementById("cancel").onclick=closeSheet;
    sheet.querySelector("textarea").select();
  }
};

hydrate().then(renderAll);
</script>
